services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwordfile:/mosquitto/config/passwordfile:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks: [edge_net]

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - "${ZIGBEE_ADAPTER_HOST}:/dev/ttyACM0"
    ports:
      - "${Z2M_UI_PORT:-8084}:8084"
    networks: [edge_net]

  nodered:
    build:
      context: .
      dockerfile: nodered/Dockerfile
    image: orka/nodered-edge:latest
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      - TZ=${TZ:-UTC}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - TB_CLOUD_HOST=${TB_CLOUD_HOST:-thingsboard.example.com}
      - TB_CLOUD_MQTT_PORT=${TB_CLOUD_MQTT_PORT:-1883}
      - TB_GATEWAY_TOKEN=${TB_GATEWAY_TOKEN:-replace-me}
      - EDGE_SWITCH_DEVICE=${EDGE_SWITCH_DEVICE:-Switch Zigbee}
      - EDGE_SENSOR_DEVICE=${EDGE_SENSOR_DEVICE:-Sensor humedad/temperatura}
    ports:
      - "${NODERED_PORT:-1880}:1880"
    volumes:
      - ./nodered/settings.js:/data/settings.js:ro
      - ./nodered/data:/data
    networks: [edge_net]

  backup:
    image: offen/docker-volume-backup:latest
    restart: unless-stopped
    environment:
      - BACKUP_CRON_EXPRESSION=${BACKUP_CRON:-0 2 * * *}
      - BACKUP_FILENAME=edge-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./zigbee2mqtt/data:/backup/zigbee2mqtt_data:ro
      - ./nodered/data:/backup/nodered_data:ro
      - ./mosquitto/data:/backup/mosquitto_data:ro
      - ./backups/edge:/archive
    networks: [edge_net]

networks:
  edge_net:
