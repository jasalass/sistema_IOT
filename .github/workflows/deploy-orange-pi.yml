name: Deploy Orange Pi

on:
  push:
    branches: [main, master]
    paths:
      - "docker-compose.edge.yml"
      - ".env.edge.example"
      - "mosquitto/**"
      - "zigbee2mqtt/**"
      - "nodered/**"
      - "scripts/make-mqtt-pass.sh"
      - ".github/workflows/deploy-orange-pi.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, orange-pi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
      - name: Docker info
        run: docker info
      - name: Deploy stack
        run: |
          docker compose -f docker-compose.edge.yml pull
          docker compose -f docker-compose.edge.yml up -d --build
          docker compose -f docker-compose.edge.yml ps
