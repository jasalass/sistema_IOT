name: Deploy Cloud Azure

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-azure
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, azure-vm, cloud]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
          path: repo

      - name: Validate required secrets
        shell: bash
        env:
          TB_DB_PASS: ${{ secrets.TB_DB_PASS }}
        run: |
          set -euo pipefail
          : "${TB_DB_PASS:?Missing GitHub secret TB_DB_PASS}"

      - name: Docker info
        run: docker info

      - name: Deploy cloud stack
        shell: bash
        env:
          TZ: ${{ vars.TZ }}
          TB_DB: ${{ vars.TB_DB }}
          TB_DB_USER: ${{ vars.TB_DB_USER }}
          TB_DB_PASS: ${{ secrets.TB_DB_PASS }}
          TB_HTTP_PORT: ${{ vars.TB_HTTP_PORT }}
          TB_MQTT_PORT: ${{ vars.TB_MQTT_PORT }}
          BACKUP_CRON: ${{ vars.BACKUP_CRON }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
          BACKUP_ARCHIVE_DIR: ${{ vars.BACKUP_ARCHIVE_DIR }}
          CLOUD_RESET_DB_ON_DEPLOY: ${{ vars.CLOUD_RESET_DB_ON_DEPLOY }}
        run: |
          set -euo pipefail
          export TZ="${TZ:-UTC}"
          export TB_DB="${TB_DB:-thingsboard}"
          export TB_DB_USER="${TB_DB_USER:-tb}"
          export TB_HTTP_PORT="${TB_HTTP_PORT:-8080}"
          export TB_MQTT_PORT="${TB_MQTT_PORT:-1883}"
          export BACKUP_CRON="${BACKUP_CRON:-0 2 * * *}"
          export BACKUP_RETENTION_DAYS="${BACKUP_RETENTION_DAYS:-14}"
          export BACKUP_ARCHIVE_DIR="${BACKUP_ARCHIVE_DIR:-$HOME/cloud-backups}"
          export COMPOSE_PROJECT_NAME="sistema_iot"
          mkdir -p "${BACKUP_ARCHIVE_DIR}"

          # One-time cleanup for old project name used during runner migration.
          docker compose -p repo -f docker-compose.cloud.yml down --remove-orphans || true

          if [ "${CLOUD_RESET_DB_ON_DEPLOY:-false}" = "true" ]; then
            echo "CLOUD_RESET_DB_ON_DEPLOY=true -> recreating DB volume"
            docker compose -f docker-compose.cloud.yml down -v --remove-orphans || true
          fi

          docker compose -f docker-compose.cloud.yml pull

          # Start DB first so we can force role password alignment before ThingsBoard starts.
          docker compose -f docker-compose.cloud.yml up -d postgres backup

          PG_CONTAINER="$(docker compose -f docker-compose.cloud.yml ps -q postgres)"
          if [ -z "${PG_CONTAINER}" ]; then
            echo "postgres container not found"
            exit 1
          fi

          for i in $(seq 1 60); do
            PG_HEALTH="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "${PG_CONTAINER}" 2>/dev/null || true)"
            if [ "${PG_HEALTH}" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          if [ "${PG_HEALTH}" != "healthy" ]; then
            echo "postgres did not become healthy"
            docker compose -f docker-compose.cloud.yml logs --tail=200 postgres
            exit 1
          fi

          SAFE_DB_USER="${TB_DB_USER//\"/}"
          SAFE_DB_USER="${SAFE_DB_USER//\'/}"
          SAFE_DB_NAME="${TB_DB//\"/}"
          SAFE_DB_NAME="${SAFE_DB_NAME//\'/}"
          SAFE_DB_PASS="${TB_DB_PASS//\'/''}"

          DB_ADMIN_USER=""
          for CANDIDATE in "${SAFE_DB_USER}" "postgres"; do
            if docker exec -u postgres "${PG_CONTAINER}" psql -At -U "${CANDIDATE}" -d postgres -c "SELECT 1;" >/dev/null 2>&1; then
              DB_ADMIN_USER="${CANDIDATE}"
              break
            fi
          done

          if [ -z "${DB_ADMIN_USER}" ]; then
            echo "No usable admin DB role found (tried '${SAFE_DB_USER}' and 'postgres')."
            exit 1
          fi

          echo "Using DB admin role: ${DB_ADMIN_USER}"

          if ! docker exec -u postgres "${PG_CONTAINER}" psql -At -U "${DB_ADMIN_USER}" -d postgres -c "SELECT 1 FROM pg_roles WHERE rolname='${SAFE_DB_USER}';" | grep -q 1; then
            docker exec -u postgres "${PG_CONTAINER}" psql -v ON_ERROR_STOP=1 -U "${DB_ADMIN_USER}" -d postgres -c "CREATE ROLE \"${SAFE_DB_USER}\" LOGIN;"
          fi
          docker exec -u postgres "${PG_CONTAINER}" psql -v ON_ERROR_STOP=1 -U "${DB_ADMIN_USER}" -d postgres -c "ALTER ROLE \"${SAFE_DB_USER}\" WITH PASSWORD '${SAFE_DB_PASS}';"
          if ! docker exec -u postgres "${PG_CONTAINER}" psql -At -U "${DB_ADMIN_USER}" -d postgres -c "SELECT 1 FROM pg_database WHERE datname='${SAFE_DB_NAME}';" | grep -q 1; then
            docker exec -u postgres "${PG_CONTAINER}" psql -v ON_ERROR_STOP=1 -U "${DB_ADMIN_USER}" -d postgres -c "CREATE DATABASE \"${SAFE_DB_NAME}\" OWNER \"${SAFE_DB_USER}\";"
          fi

          # Start or recreate ThingsBoard after DB credentials are aligned.
          docker compose -f docker-compose.cloud.yml up -d thingsboard
          docker compose -f docker-compose.cloud.yml ps
